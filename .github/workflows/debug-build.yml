name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: this repo's gradlew script and gradle/wrapper/gradle-wrapper.jar
      # are not present in the project (only gradle-wrapper.properties is),
      # so we install Gradle directly via this action instead of calling
      # ./gradlew. If you add the missing wrapper files later, this step can
      # be switched to `chmod +x gradlew && ./gradlew assembleDebug`.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickdrop-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
